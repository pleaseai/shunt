name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger a backtest run to seed the initial baseline.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.ref }}
  # Don't cancel an in-progress run on main: that run is what CodSpeed stores
  # as the comparison baseline, so cancelling it leaves the commit unmeasured
  # and later PRs compare against an older one. 4 of the last 30 main runs died
  # that way. PR runs stay cancellable — a superseded PR head seeds nothing.
  #
  # This narrows the gap rather than closing it. A concurrency group holds one
  # running and one pending execution, and a newly queued run replaces the
  # pending one, so a burst of three or more pushes to main can still leave a
  # middle commit unmeasured. Lifting that needs `queue: max`, which cannot be
  # combined with the `cancel-in-progress: true` the PR side uses here — see
  # issue #629.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Run benchmarks
    # One OS version rather than the moving `ubuntu-latest` label, so a Ubuntu
    # major bump cannot land on one side of a comparison only. This is not an
    # immutable environment: GitHub still revises the image behind this label,
    # and the CPU model is not pinnable on hosted runners at all — the step
    # below logs both so a mismatch is visible instead of inferred. Pinning
    # those needs a container or dedicated runner; that call is issue #629.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # CodSpeed's simulation mode estimates cycles from instruction and cache
      # behaviour, so a comparison is only meaningful when both sides were
      # measured in the same environment. When a report says "Different runtime
      # environments detected", diff these two lines between the PR run and the
      # baseline run on main before reading the percentage as a code change.
      - name: Record the measurement environment
        run: |
          echo "image: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
          echo "cpu: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)"

      - name: Setup Rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@cafffba5d5c8bc38a5120e6e60f3561d541a47cd # v0
        with:
          # Pinned rather than `stable`: a new rustc changes codegen, so every
          # six-week release would shift the measurement under the stored
          # baseline and show up as a repo-wide "regression" on unrelated PRs.
          # Bump deliberately — the first main run afterwards re-seeds the
          # baseline, and PRs opened before it compare across the boundary.
          channel: "1.98.1"
          cache-target: release
          bins: cargo-codspeed

      # `--features bench` is required, not optional: `benches/stage_router.rs`
      # reaches the crate-private stage-router path through `shunt::bench_support`,
      # which that feature gates. Without it the target still builds and still
      # runs — it just registers no benchmarks, so the stage-router measurements
      # would silently disappear from CodSpeed rather than fail (issue #554).
      - name: Build the benchmark target(s)
        run: cargo codspeed build --features bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286 # v4.18.5
        with:
          mode: simulation
          run: cargo codspeed run
