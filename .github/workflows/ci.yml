name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    # sccache vars are scoped per-job (not top-level env): a future job that runs
    # Cargo without installing sccache first would otherwise fail on a missing
    # binary. rust-cache keeps cache-targets:false so the two split roles;
    # sccache can't cache incremental builds, so disable it.
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      # `--all-features` turns on `ui`, which embeds `ui/dist`; without the
      # bundle the cargo steps below fail to compile. Node is needed only for
      # that build, never for a default `cargo build`.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install admin UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build admin UI bundle
        working-directory: ui
        run: npm run build

      # The dashboard's behavior lives in this bundle, so its suite is a gate
      # here rather than a local convenience. `npm run build` above only
      # typechecks it.
      - name: Test admin UI bundle
        working-directory: ui
        run: npm test

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --workspace

      # `--all-features` compiles the `#[cfg(not(feature = "ui"))]` arms out
      # entirely, so the default build's answers — `GET /admin` reporting that
      # this binary embeds no bundle, and the two route-inventory arms beside it
      # — were dead source as far as CI was concerned. Scoped to the one test
      # binary that carries those arms rather than a second full suite: the
      # marginal cost is this crate compiled once with default features, not
      # every test binary rebuilt. A `#[cfg(not(feature = "ui"))]` arm added to
      # any *other* test file is not covered by this and needs its binary named
      # here too.
      - name: Test default build (no ui feature)
        run: cargo test --test router_surface

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  coverage:
    name: coverage · codecov · sonarqube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # SonarQube needs full history for new-code detection
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: llvm-tools-preview

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      # `--all-features` turns on `ui`, which embeds `ui/dist`; without the
      # bundle the cargo steps below fail to compile. Node is needed only for
      # that build, never for a default `cargo build`.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install admin UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build admin UI bundle
        working-directory: ui
        run: npm run build

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

      - name: SonarQube Cloud Scan
        # Guard keeps CI green on forks / before the secret is provisioned.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
