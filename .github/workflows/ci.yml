name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    # mbx wraps rustc itself and defers to a preset wrapper (caching nothing),
    # so no RUSTC_WRAPPER may be set here.
    env:
      CARGO_INCREMENTAL: 0
      SHUNT_TEST_POSTGRES_URL: postgres://shunt:shunt-ci@localhost:5432/shunt_test
      SHUNT_TEST_POSTGRES_REQUIRED: "1"
    # PostgreSQL for the store contract tests (src/store/contract.rs): every
    # store test runs once per engine. REQUIRED=1 turns an unset or unreachable
    # URL into a failure, so a broken service can never skip the postgres arm.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: shunt
          POSTGRES_PASSWORD: shunt-ci
          POSTGRES_DB: shunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      # After the toolchain step: the cache key hashes the `rustc` on PATH.
      - name: Set up mbx cache
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: 1.29.2
          cache-generation: test-v1

      # `--all-features` turns on `ui`, which embeds `ui/dist`; without the
      # bundle the cargo steps below fail to compile. Node is needed only for
      # that build, never for a default `cargo build`.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            plugins/shunt/package-lock.json

      - name: Install admin UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build admin UI bundle
        working-directory: ui
        run: npm run build

      # The dashboard's behavior lives in this bundle, so its suite is a gate
      # here rather than a local convenience. `npm run build` above only
      # typechecks it.
      - name: Test admin UI bundle
        working-directory: ui
        run: npm test

      # The shunt mod answers /shunt:usage and draws its usage band from
      # TypeScript, not from the Rust binary, so its suite is a gate here
      # rather than a local convenience. `claude plugin validate` and
      # `claude plugin test` (which check the hooks module itself) need a
      # Claude Code binary and do not run here; the modules they cannot reach
      # here are the pure ones this suite covers.
      - name: Install shunt mod dependencies
        working-directory: plugins/shunt
        run: npm ci

      # `hooks/register.tsx` is left out of the typecheck: it is the only module
      # importing `claude-code`, whose types Claude Code generates locally via
      # /plugin-types and which does not exist here (see plugins/shunt/tsconfig.json).
      # The engine suite, `tests/mod`, is left out for the same reason.
      - name: Typecheck shunt mod
        working-directory: plugins/shunt
        run: npm run typecheck

      - name: Test shunt mod
        working-directory: plugins/shunt
        run: npm test

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: mbx clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: mbx test --all-features --workspace

      # `--all-features` compiles the `#[cfg(not(feature = "ui"))]` arms out
      # entirely, so the default build's answers — `GET /admin` reporting that
      # this binary embeds no bundle, and the two route-inventory arms beside it
      # — were dead source as far as CI was concerned. Scoped to the one test
      # binary that carries those arms rather than a second full suite: the
      # marginal cost is this crate compiled once with default features, not
      # every test binary rebuilt. A `#[cfg(not(feature = "ui"))]` arm added to
      # any *other* test file is not covered by this and needs its binary named
      # here too — for a module inside a grouped binary (`tests/<dir>/main.rs`,
      # such as `tests/spend/`), that is the group's name (`--test spend`), not
      # the file's. `prefill_router` is named for the same reason against a
      # different feature: its `#[cfg(not(feature = "prefill-router"))]` arm is
      # the one that proves a release binary refuses a `type = "prefill_router"`
      # entry by naming the cargo feature, and `--all-features` compiles that
      # arm away.
      - name: Test default build (no ui feature)
        run: mbx test --test router_surface --test prefill_router

  coverage:
    name: coverage · codecov · sonarqube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CARGO_INCREMENTAL: 0
      SHUNT_TEST_POSTGRES_URL: postgres://shunt:shunt-ci@localhost:5432/shunt_test
      SHUNT_TEST_POSTGRES_REQUIRED: "1"
    # PostgreSQL for the store contract tests (src/store/contract.rs): every
    # store test runs once per engine. REQUIRED=1 turns an unset or unreachable
    # URL into a failure, so a broken service can never skip the postgres arm.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: shunt
          POSTGRES_PASSWORD: shunt-ci
          POSTGRES_DB: shunt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # SonarQube needs full history for new-code detection
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: llvm-tools-preview

      - name: Set up mbx cache
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: 1.29.2
          cache-generation: coverage-v1

      # `--all-features` turns on `ui`, which embeds `ui/dist`; without the
      # bundle the cargo steps below fail to compile. Node is needed only for
      # that build, never for a default `cargo build`.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            plugins/shunt/package-lock.json

      - name: Install admin UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build admin UI bundle
        working-directory: ui
        run: npm run build

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: mbx llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

      - name: SonarQube Cloud Scan
        # Guard keeps CI green on forks / before the secret is provisioned.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
